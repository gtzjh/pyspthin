[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspthin"
version = "0.2.1"
description = "Python reimplementation of spThin with sparse conflict graphs and explicit reproducibility controls."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
  { name = "OpenAI Codex" },
]
dependencies = [
  "annotated-types==0.7.0",
  "build==1.5.0",
  "certifi==2026.4.22",
  "cffi==2.0.0",
  "charset-normalizer==3.4.7",
  "contourpy==1.3.3",
  "coverage==7.13.5",
  "cryptography==47.0.0",
  "cycler==0.12.1",
  "docutils==0.22.4",
  "execnet==2.1.2",
  "fonttools==4.62.1",
  "id==1.6.1",
  "idna==3.13",
  "iniconfig==2.3.0",
  "jaraco-classes==3.4.0",
  "jaraco-context==6.1.2",
  "jaraco-functools==4.4.0",
  "jeepney==0.9.0",
  "keyring==25.7.0",
  "kiwisolver==1.5.0",
  "librt==0.9.0",
  "markdown-it-py==4.0.0",
  "matplotlib==3.10.9",
  "mdurl==0.1.2",
  "more-itertools==11.0.2",
  "mypy==1.20.2",
  "mypy-extensions==1.1.0",
  "nh3==0.3.5",
  "numpy==2.4.4",
  "packaging==26.2",
  "pandas==3.0.2",
  "pandas-stubs==3.0.0.260204",
  "pathspec==1.1.1",
  "pillow==12.2.0",
  "pluggy==1.6.0",
  "psutil==7.2.2",
  "pycparser==3.0",
  "pydantic==2.13.3",
  "pydantic-core==2.46.3",
  "pygments==2.20.0",
  "pyparsing==3.3.2",
  "pyproject-hooks==1.2.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "python-dateutil==2.9.0.post0",
  "readme-renderer==44.0",
  "requests==2.33.1",
  "requests-toolbelt==1.0.0",
  "rfc3986==2.0.0",
  "rich==15.0.0",
  "ruff==0.15.12",
  "secretstorage==3.5.0",
  "six==1.17.0",
  "twine==6.2.0",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
  "urllib3==2.6.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8",
  "ruff>=0.4",
  "twine>=5.1",
]

[project.urls]
Repository = "https://github.com/gtzjh/pyspthin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyspthin = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["pyspthin"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
