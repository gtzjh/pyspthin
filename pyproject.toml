[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspthin"
version = "0.2.0"
description = "Python reimplementation of spThin with sparse conflict graphs and explicit reproducibility controls."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
  { name = "OpenAI Codex" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8",
  "ruff>=0.4",
  "twine>=5.1",
]

[project.urls]
Repository = "https://github.com/gtzjh/pyspthin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyspthin = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
packages = ["pyspthin"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
